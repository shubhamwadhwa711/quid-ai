version: '3.8'

services:
  backend:
    build:
      context: ../Backend
      dockerfile: Dockerfile
    container_name: backend-qa
    command: sh -c "ls && python manage.py migrate && python manage.py runserver"
    volumes:
      - ../Backend:/app
    ports:
      - "8000:8000"
    env_file:
      - ../Backend/core/.env
    networks:
      - quid-ai-nw
